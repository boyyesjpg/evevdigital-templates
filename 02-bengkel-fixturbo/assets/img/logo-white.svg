<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52">
  <defs>
    <linearGradient id="bengkelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#E8092E" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#C40520" />
    </linearGradient>
  </defs>

  <!-- Icon: Shield / Hexagon with Gear & Wrench -->
  <g transform="translate(4, 3)">
    <!-- Hexagon Shield Background -->
    <polygon points="23,2 42,12 42,34 23,44 4,34 4,12" fill="url(#gearGrad)" rx="2" />
    <!-- Gear Rim Inner -->
    <circle cx="23" cy="23" r="13" fill="#111827" />
    <!-- Crossed Wrench / Spark -->
    <path d="M17 17 L29 29 M29 17 L17 29" stroke="#FF8A65" stroke-width="3" stroke-linecap="round" />
    <circle cx="23" cy="23" r="5" fill="url(#bengkelGrad)" />
    <!-- Speed Notch -->
    <path d="M4 23 L9 23 M37 23 L42 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: evevbengkel -->
  <text x="56" y="31" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="25" letter-spacing="-0.5">
    <tspan fill="#FF4500">evev</tspan><tspan fill="#FFFFFF">bengkel</tspan>
  </text>
  
  <!-- Subtitle: MOTOR & MOBIL PRO -->
  <text x="58" y="44" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="2.2">
    MOTOR &amp; MOBIL PRO
  </text>
</svg>
