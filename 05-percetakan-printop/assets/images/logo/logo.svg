<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <!-- CMYK / Print Layer Icon -->
  <g transform="translate(4, 6)">
    <!-- Cyan Paper Sheet -->
    <rect x="6" y="2" width="22" height="28" rx="3" fill="#00A3E0" opacity="0.85"/>
    <!-- Magenta Paper Sheet -->
    <rect x="11" y="7" width="22" height="28" rx="3" fill="#E6007E" opacity="0.85"/>
    <!-- Yellow / Black Paper Sheet (Main) -->
    <rect x="16" y="12" width="22" height="28" rx="3" fill="#1A202C"/>
    <!-- Laser line / CMYK dots inside -->
    <circle cx="21" cy="20" r="2" fill="#00A3E0"/>
    <circle cx="27" cy="20" r="2" fill="#E6007E"/>
    <circle cx="33" cy="20" r="2" fill="#FFD100"/>
    <rect x="21" y="26" width="12" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="21" y="31" width="8" height="2" rx="1" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <!-- Text Brand -->
  <text x="56" y="37" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#0B1320" letter-spacing="-0.5">evev<tspan fill="#E6007E">print</tspan></text>
  <text x="180" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#00A3E0" letter-spacing="1.5">PRO</text>
  <text x="57" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#64748B" letter-spacing="1.2">DIGITAL PRINT &amp; FOTOCOPY</text>
</svg>